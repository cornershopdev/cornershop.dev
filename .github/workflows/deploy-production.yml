name: Deploy production

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published stable release tag being deployed
        required: true
        type: string
      release_url:
        description: Public GitHub release URL recorded in deployment evidence
        required: true
        type: string

concurrency:
  group: cornershopdev-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      AWS_REGION: us-west-1
      ARTIFACT_BUCKET: cornershopdev-production-deploy-948918267147-us-west-1
      INSTANCE_ID: i-00e74422e719396c3
      ROLE_ARN: arn:aws:iam::948918267147:role/cornershopdev-github-production-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify released commit is merged to main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production releases require a stable vX.Y.Z tag" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tagged_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag does not resolve to the workflow SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Released commit is not merged into origin/main" >&2
            exit 1
          fi
          echo "release-state code-merged sha=${GITHUB_SHA} tag=${RELEASE_TAG}"

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        run: docker build --tag "cornershopdev:${GITHUB_SHA}" .

      - name: Package production image
        run: docker save "cornershopdev:${GITHUB_SHA}" | gzip -1 > cornershopdev.tar.gz

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}

      - name: Upload immutable deployment artifacts
        id: artifacts
        run: |
          deploy_script_sha256="$(sha256sum deploy/aws/deploy.sh | awk '{print $1}')"
          aws s3 cp \
            cornershopdev.tar.gz \
            "s3://${ARTIFACT_BUCKET}/images/${GITHUB_SHA}.tar.gz" \
            --sse AES256 \
            --only-show-errors
          aws s3 cp \
            deploy/aws/deploy.sh \
            "s3://${ARTIFACT_BUCKET}/images/${GITHUB_SHA}.deploy.sh" \
            --sse AES256 \
            --only-show-errors
          aws s3 cp \
            deploy/aws/host-launcher.sh \
            "s3://${ARTIFACT_BUCKET}/images/${GITHUB_SHA}.host-launcher.sh" \
            --sse AES256 \
            --only-show-errors
          aws s3 cp \
            deploy/aws/bootstrap-host.sh \
            "s3://${ARTIFACT_BUCKET}/images/${GITHUB_SHA}.bootstrap-host.sh" \
            --sse AES256 \
            --only-show-errors
          aws s3 cp \
            deploy/aws/Caddyfile.fragment \
            "s3://${ARTIFACT_BUCKET}/images/${GITHUB_SHA}.Caddyfile.fragment" \
            --sse AES256 \
            --only-show-errors
          echo "deploy_script_sha256=${deploy_script_sha256}" >>"$GITHUB_OUTPUT"

      - name: Deploy through Systems Manager
        id: deploy
        run: |
          artifact_uri="s3://${ARTIFACT_BUCKET}/images/${GITHUB_SHA}.tar.gz"
          deploy_script_sha256="${{ steps.artifacts.outputs.deploy_script_sha256 }}"
          command="sudo /usr/local/bin/deploy-cornershopdev '${artifact_uri}' 'cornershopdev:${GITHUB_SHA}' '${deploy_script_sha256}'"
          parameters="$(jq -cn --arg command "$command" '{commands: [$command]}')"
          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name AWS-RunShellScript \
              --instance-ids "$INSTANCE_ID" \
              --comment "Deploy Cornershopdev ${GITHUB_SHA}" \
              --parameters "$parameters" \
              --query "Command.CommandId" \
              --output text
          )"
          echo "command_id=${command_id}" >>"$GITHUB_OUTPUT"
          for _ in $(seq 1 90); do
            status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"
            case "$status" in
              Success) break ;;
              Cancelled|Cancelling|Failed|TimedOut)
                echo "Deployment command ended with ${status}" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          if [[ "$status" != "Success" ]]; then
            echo "Deployment command did not finish within 15 minutes" >&2
            exit 1
          fi
          output="$(
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query StandardOutputContent \
              --output text
          )"
          sentinel="deploy-script verified sha256=${deploy_script_sha256}"
          if ! grep -Fxq "$sentinel" <<<"$output"; then
            echo "Deployment host did not verify the exact deploy script" >&2
            exit 1
          fi
          for state in \
            configuration-loaded \
            caddy-configured \
            migrations-applied \
            outreach-configured \
            wildcard-dns-ready \
            platform-tls-ready \
            production-deployed; do
            if ! grep -Fxq "release-state ${state} sha=${GITHUB_SHA}" <<<"$output"; then
              echo "Deployment did not prove release state: ${state}" >&2
              exit 1
            fi
          done
          printf '%s\n' "$output" >"$RUNNER_TEMP/deploy-output.txt"

      - name: Print deployment result
        if: always() && steps.deploy.outputs.command_id
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify production
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://api.cornershop.dev/api/health/live

      - name: Record release evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_URL: ${{ inputs.release_url }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          mkdir -p release-evidence
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg workflowRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg commandId "$COMMAND_ID" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 1,
              release: {tag: $tag, sha: $sha, url: $releaseUrl},
              evidence: {workflowRun: $workflowRun, systemsManagerCommandId: $commandId, verifiedAt: $verifiedAt},
              states: {
                codeMerged: "VERIFIED",
                caddyConfigured: "VERIFIED",
                productionConfigured: "VERIFIED",
                migrationsApplied: "VERIFIED",
                outreachConfigured: "VERIFIED",
                platformWildcardDnsReady: "VERIFIED",
                platformTlsReady: "VERIFIED",
                productionDeployed: "VERIFIED",
                customerAcceptanceProven: "NOT_EVALUATED"
              },
              acceptanceBoundary: "Release automation never substitutes for a real payment, owner action, published customer site, or owner-authorized custom domain."
            }' >"release-evidence/${GITHUB_SHA}.json"
          cp "$RUNNER_TEMP/deploy-output.txt" "release-evidence/${GITHUB_SHA}.deploy-output.txt"
          {
            echo "## Production release evidence"
            echo
            echo "- Released and deployed SHA: \`${GITHUB_SHA}\`"
            echo "- Stable release: \`${RELEASE_TAG}\`"
            echo "- Caddy, configuration, migrations, outreach, wildcard DNS, on-demand TLS, and exact running image: verified"
            echo "- Customer acceptance: not evaluated by deployment automation"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-release-${{ inputs.release_tag }}
          path: release-evidence/
          retention-days: 90
