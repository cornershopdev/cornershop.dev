name: Dependency audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit locked dependencies
        shell: bash
        run: |
          set -o pipefail
          bun audit --json | tee bun-audit.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-audit-json
          path: bun-audit.json
          if-no-files-found: error
